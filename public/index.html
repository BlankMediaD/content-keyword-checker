<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Keyword Checker</title>
  <style>
    .highlight { background-color: yellow; }
  </style>
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="mb-4">Content Keyword Checker</h1>
  <div class="mb-3">
    <label class="form-label">Title</label>
    <input type="text" id="title" class="form-control" placeholder="Result title" />
  </div>
  <div class="mb-3">
    <label class="form-label">Keywords (comma or newline separated)</label>
    <textarea id="keywords" rows="3" class="form-control"></textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Content</label>
    <textarea id="content" rows="6" class="form-control"></textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Highlighted Content</label>
    <div id="highlighted" class="p-2 border bg-white" style="min-height:150px"></div>
  </div>
  <button id="checkBtn" class="btn btn-primary mb-3">Check &amp; Save</button>
  <h3>Results</h3>
  <ul id="resultList" class="list-group mb-4"></ul>
  <h3>Previous Checks</h3>
  <ul id="history" class="list-group"></ul>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
